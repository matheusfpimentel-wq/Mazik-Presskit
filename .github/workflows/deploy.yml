name: Publicar mazik.com.br

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-mazik
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 842c02d34f31f13df9d130f04cbd84a4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Montar a pasta do site (com worker e /oi)
        run: node scripts/build-dist.mjs
      - name: Publicar no Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=mazik --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.event.head_commit.message || 'deploy manual' }}" --commit-dirty=true
